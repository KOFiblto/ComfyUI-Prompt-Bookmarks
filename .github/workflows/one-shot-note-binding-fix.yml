name: one-shot note binding fix

on:
  push:
    branches:
      - fix/note-existing-binding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/note-existing-binding
      - name: Keep note-like fields unchecked by default
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/prompt_bookmarks.js')
          text = path.read_text(encoding='utf-8')
          old = '''        display_path: displayPath, group_path: groupPath, preview: String(widget.value || ""),\n        recommended: !isNote && (likely.test(name) || likely.test(title)),'''
          new = '''        display_path: displayPath, group_path: groupPath, preview: String(widget.value || ""),\n        note_like: isNote,\n        recommended: !isNote && (likely.test(name) || likely.test(title)),'''
          if old not in text:
              raise SystemExit('candidate block not found')
          text = text.replace(old, new, 1)
          old = '''  const selected = new Set(candidates.filter((c) => existing.has(`${c.node_id}::${c.widget_name}`) || (!usableExisting && c.recommended)).map((c) => `${c.node_id}::${c.widget_name}`));'''
          new = '''  const selected = new Set(candidates.filter((c) => !c.note_like && (existing.has(`${c.node_id}::${c.widget_name}`) || (!usableExisting && c.recommended))).map((c) => `${c.node_id}::${c.widget_name}`));'''
          if old not in text:
              raise SystemExit('selection block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check web/prompt_bookmarks.js
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-note-binding-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt_bookmarks.js .github/workflows/one-shot-note-binding-fix.yml
          git commit -m "fix: keep note-like fields unchecked by default"
          git push origin HEAD:fix/note-existing-binding
